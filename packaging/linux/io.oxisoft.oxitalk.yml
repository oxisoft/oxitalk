# Flatpak of OxiTalk, built from the release bundle of `flutter build linux --release`
# (packaging/linux/build.sh stages it in ./stage beside this file). Not on Flathub: the
# .flatpak single-file bundle goes on the GitHub release.
#
# The GNOME runtime brings GTK 3, libsecret and pulseaudio-utils (pacat plays audio,
# parecord records voice messages).
app-id: io.oxisoft.oxitalk
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: oxitalk
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Voice messages, audio files and calls.
  - --socket=pulseaudio
  # Calls: camera.
  - --device=all
  # Login tokens and keys in the desktop's keyring (libsecret).
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=xdg-download
modules:
  - name: oxitalk
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/oxitalk /app/bin
      - cp -a bundle/. /app/lib/oxitalk/
      - ln -s /app/lib/oxitalk/oxitalk /app/bin/oxitalk
      - install -Dm644 io.oxisoft.oxitalk.desktop /app/share/applications/io.oxisoft.oxitalk.desktop
      - install -Dm644 bundle/data/app_icon.png /app/share/icons/hicolor/256x256/apps/io.oxisoft.oxitalk.png
      - install -Dm644 io.oxisoft.oxitalk.metainfo.xml /app/share/metainfo/io.oxisoft.oxitalk.metainfo.xml
    sources:
      - type: dir
        path: stage
