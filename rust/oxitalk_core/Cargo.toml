[package]
name = "oxitalk_core"
description = "OxiTalk's Rust core: the Matrix facade the Flutter app talks to."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge.workspace = true
futures-util.workspace = true
image.workspace = true
matrix-sdk.workspace = true
matrix-sdk-sqlite.workspace = true
matrix-sdk-ui.workspace = true
mime.workspace = true
ogg.workspace = true
opus-rs.workspace = true
ruma.workspace = true
rustls.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
matrix-sdk = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock.workspace = true

[lints]
workspace = true
