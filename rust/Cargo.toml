[workspace]
resolver = "3"
members = ["oxitalk_core"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/oxisoft/oxitalk"

[workspace.dependencies]
flutter_rust_bridge = "=2.13.0"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"
unused_qualifications = "warn"
# Set by flutter_rust_bridge's code generator.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
