[workspace]
resolver = "3"
members = ["oxitalk_core"]

[workspace.package]
version = "0.1.23"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/oxisoft/oxitalk"

[workspace.dependencies]
flutter_rust_bridge = "=2.13.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# D5: a rev of main, bumped every 2 weeks. Default features off: TLS is rustls + ring (P1), not aws-lc-rs.
# All matrix-rust-sdk crates stay on the same rev.
matrix-sdk = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "f06f62654e155be50be091ffef5304025b5928da", default-features = false, features = ["automatic-room-key-forwarding", "bundled-sqlite", "e2e-encryption", "experimental-element-recent-emojis", "markdown"] }
matrix-sdk-sqlite = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "f06f62654e155be50be091ffef5304025b5928da", default-features = false }
matrix-sdk-ui = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "f06f62654e155be50be091ffef5304025b5928da", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
mime = "0.3.17"
# Only for its Matrix HTML model (feature html-matrix); the same rev as matrix-rust-sdk's.
ruma = { git = "https://github.com/ruma/ruma", rev = "caf1ac05a9fd347158b60505ef8546a2ff18ae7c", default-features = false, features = ["html-matrix"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = "1.53.2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
# No ANSI colours or `log` bridge: the output goes to a file.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }
wiremock = "0.6.5"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"
unused_qualifications = "warn"
# Set by flutter_rust_bridge's code generator.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
