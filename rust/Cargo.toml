[workspace]
resolver = "3"
members = ["oxitalk_core"]

[workspace.package]
version = "0.1.41"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/oxisoft/oxitalk"

# The app's size: the Flutter build hook builds the core with --release. Without this the core was
# 122 MB on x86_64 Linux (no LTO, symbols kept); with it 37.5 MB, at opt-level "s" ("z" saved only
# 0.5 MB more, 3 gave 61 MB). Debug app builds and flutter test turn off LTO, the single codegen unit
# and stripping (apps/oxitalk/hook/build.dart).
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
strip = "symbols"

# Full speed where the time goes: Matrix crypto, key derivation, image decoding, voice messages and
# sqlite. 1.5 MB more than "s" for all of them (39.0 MB on x86_64 Linux).
[profile.release.package.aes]
opt-level = 3
[profile.release.package.blake3]
opt-level = 3
[profile.release.package.chacha20]
opt-level = 3
[profile.release.package.chacha20poly1305]
opt-level = 3
[profile.release.package.ctr]
opt-level = 3
[profile.release.package.curve25519-dalek]
opt-level = 3
[profile.release.package.ed25519-dalek]
opt-level = 3
[profile.release.package.fdeflate]
opt-level = 3
[profile.release.package.gif]
opt-level = 3
[profile.release.package.hkdf]
opt-level = 3
[profile.release.package.hmac]
opt-level = 3
[profile.release.package.image]
opt-level = 3
[profile.release.package.image-webp]
opt-level = 3
[profile.release.package.libsqlite3-sys]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3
[profile.release.package.opus-rs]
opt-level = 3
[profile.release.package.pbkdf2]
opt-level = 3
[profile.release.package.png]
opt-level = 3
[profile.release.package.poly1305]
opt-level = 3
[profile.release.package.ring]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3
[profile.release.package.vodozemac]
opt-level = 3
[profile.release.package.x25519-dalek]
opt-level = 3
[profile.release.package.zune-jpeg]
opt-level = 3

# Day-to-day builds and tests: dependencies without debug info (rust/target/debug had grown to
# 41 GB) and lightly optimised, so crypto and sqlite aren't crawling in the homeserver tests. The
# core itself keeps full debug info.
[profile.dev.package."*"]
debug = false
opt-level = 1

[workspace.dependencies]
# Calls: the media keys as Element Call sends them (standard base64) and made from OS randomness.
base64 = "0.22.1"
flutter_rust_bridge = "=2.13.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
# D5: a rev of main, bumped every 2 weeks. Default features off: TLS is rustls + ring (P1), not aws-lc-rs.
# All matrix-rust-sdk crates stay on the same rev.
matrix-sdk = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "a39665d63d052919defc4a9da76fa5e190fac5fe", default-features = false, features = ["automatic-room-key-forwarding", "bundled-sqlite", "e2e-encryption", "experimental-element-recent-emojis", "experimental-send-custom-to-device", "markdown"] }
matrix-sdk-sqlite = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "a39665d63d052919defc4a9da76fa5e190fac5fe", default-features = false }
matrix-sdk-ui = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "a39665d63d052919defc4a9da76fa5e190fac5fe", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
mime = "0.3.17"
# Voice messages as Element sends them, Ogg Opus, in pure Rust: no C toolchain for any target.
ogg = "0.9.2"
opus-rs = "0.1.39"
# Only for its Matrix HTML model (feature html-matrix); the same rev as matrix-rust-sdk's.
ruma = { git = "https://github.com/ruma/ruma", rev = "e03080c0790ba7b24ea37f9fd11794678cc975b0", default-features = false, features = ["html-matrix"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = "1.53.2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
# No ANSI colours or `log` bridge: the output goes to a file.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }
wiremock = "0.6.5"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"
unused_qualifications = "warn"
# Set by flutter_rust_bridge's code generator.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
