# LiveKit SFU for the call tests (test-infra/rtc/up.sh). Test only: a public dev key, loopback.
# The client ports are the same inside the pod and on the host, because LiveKit tells clients
# its own ports in the ICE candidates.
port: 7890
rtc:
  tcp_port: 7891
  udp_port: 7892
  use_external_ip: false
  node_ip: 127.0.0.1
room:
  # lk-jwt-service creates the room (LIVEKIT_FULL_ACCESS_HOMESERVERS), as in production.
  auto_create: false
keys:
  oxitalk-test-key: oxitalk-test-only-livekit-secret-0123456789
logging:
  level: info
