name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: scripts/ci.sh (Linux, Android)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: apps/oxitalk/pubspec.yaml
          cache: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: flutter_rust_bridge_codegen@2.13.0,cargo-expand@1.0.126,cargo-llvm-cov@0.9.1,zizmor@1.30.1
      # install-action has no actionlint; Go's checksum database verifies the module.
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev xvfb
      - name: Android NDK and platform pinned by the app
        run: |
          ndk=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' apps/oxitalk/android/app/build.gradle.kts)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" "platforms;android-37.0" >/dev/null
      - run: ./scripts/ci.sh

  apple:
    name: iOS + macOS
    runs-on: macos-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/oxitalk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: apps/oxitalk/pubspec.yaml
          cache: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - run: xcodebuild -version
      - name: clippy (Apple targets)
        working-directory: rust
        run: |
          cargo clippy --workspace --locked --target aarch64-apple-darwin -- -D warnings
          cargo clippy --workspace --locked --target aarch64-apple-ios -- -D warnings
      - run: flutter pub get --enforce-lockfile
      - run: flutter test
      # No signing on CI (no certificates): the entitlements need a provisioning profile.
      - run: flutter build macos --debug
        env:
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: "NO"
          FLUTTER_XCODE_CODE_SIGNING_REQUIRED: "NO"
      - run: flutter build ios --debug --no-codesign

  windows:
    name: Windows
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/oxitalk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: apps/oxitalk/pubspec.yaml
          cache: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - name: clippy (Windows)
        working-directory: rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: flutter pub get --enforce-lockfile
      - run: flutter test
      - run: flutter build windows --debug
