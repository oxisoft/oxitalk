name: App Store release

# Builds the iOS and macOS apps, signs them with Apple's cloud-managed distribution
# certificate and uploads them to App Store Connect, where they appear in TestFlight.
# Nothing is ever submitted for review. Runs on a pushed tag v<version> (equal to the
# version in apps/oxitalk/pubspec.yaml, with or without +build) or by hand.
#
# The App Store Connect API key comes from the secrets of the app-store environment:
# ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 (the whole AuthKey .p8 file).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        default: main
      platforms:
        description: Platforms to build
        type: choice
        options: [ios and macos, ios, macos]
        default: ios and macos
      upload:
        description: Upload to App Store Connect (off = build and sign only)
        type: boolean
        default: true

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ matrix.platform }}
    runs-on: macos-latest
    timeout-minutes: 90
    environment: app-store
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: >-
          ${{ fromJSON(inputs.platforms == 'ios' && '["ios"]'
          || inputs.platforms == 'macos' && '["macos"]' || '["ios", "macos"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Tag matches the app version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version: *//p' apps/oxitalk/pubspec.yaml)
          echo "tag $TAG, pubspec $version"
          [ "${TAG#v}" = "$version" ] || [ "${TAG#v}" = "${version%%+*}" ]

      # No cache: a release is built from a clean toolchain.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: apps/oxitalk/pubspec.yaml

      - run: xcodebuild -version

      - name: Dependencies
        working-directory: apps/oxitalk
        run: flutter pub get --enforce-lockfile

      # Without the key a build-only run stops after signing ad hoc (a build check).
      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          [ -n "$ASC_KEY_P8" ] || { echo "::warning::the app-store environment has no ASC_KEY_P8"; exit 0; }
          umask 077
          printf '%s\n' "$ASC_KEY_P8" >"$RUNNER_TEMP/AuthKey.p8"

      - name: Build, sign and ${{ (github.event_name == 'push' || inputs.upload) && 'upload' || 'export' }}
        env:
          PLATFORM: ${{ matrix.platform }}
          UPLOAD: ${{ (github.event_name == 'push' || inputs.upload) && '--upload' || '' }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          args=("$PLATFORM")
          [ -z "$UPLOAD" ] || args+=("$UPLOAD")
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" ./scripts/apple-release.sh "${args[@]}"

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.platform }}
          path: apps/oxitalk/build/release-${{ matrix.platform }}/*.log
          if-no-files-found: ignore

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
